name: iOS TestFlight

on:
  push:
    branches:
      - cursor/escape-kraft-feel-menus-a233
    paths:
      - "apps/espresso-escape/assets/game/**"
      - "apps/espresso-escape/assets/sfx/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        type: choice
        options:
          - espresso-escape
          - casa-rustico-go
        default: espresso-escape
      profile:
        description: "EAS profile"
        required: true
        type: choice
        options:
          - production
          - internal
        default: production
      submit:
        description: "Auto-submit to App Store Connect after build"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ github.event_name == 'workflow_dispatch' && inputs.app || 'espresso-escape' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate real Escape 1.0.6 craft + P0 sfx
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pngs=$(find apps/espresso-escape/assets/game -name '*.png' | wc -l)
          runner=0
          if [ -f apps/espresso-escape/assets/game/sprites/runner-01.png ]; then
            runner=$(stat -c%s apps/espresso-escape/assets/game/sprites/runner-01.png)
          fi
          echo "craft PNGs=$pngs runner-01=$runner"
          fail=0
          for key in hop land bean whoosh stamp steam; do
            sz=0
            f="apps/espresso-escape/assets/sfx/${key}.wav"
            if [ -f "$f" ]; then sz=$(stat -c%s "$f"); fi
            echo "sfx ${key}.wav=$sz"
            if [ "$sz" -lt 4096 ]; then
              echo "STUB sfx ${key}.wav"
              fail=1
            fi
          done
          if [ "$pngs" -lt 100 ] || [ "$runner" -lt 4096 ] || [ "$fail" -eq 1 ]; then
            echo "NEED real craft+p0 bytes — skip EAS on this SHA"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ github.event_name == 'workflow_dispatch' && inputs.app || 'espresso-escape' }}/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo auth
        run: eas whoami

      - name: Write App Store Connect API key (optional)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > asc-api-key.p8
            echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"
            echo "ASC API key file written"
          else
            echo "No APPLE_API_KEY_P8 secret — using Expo-stored Apple credentials if configured"
          fi

      - name: Build iOS
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_USE_PRECOMPILED_MODULES: "0"
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          profile="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}"
          submit="${{ github.event_name == 'workflow_dispatch' && inputs.submit || true }}"
          if [ "$submit" = "true" ]; then
            eas build --platform ios --profile "$profile" --non-interactive --auto-submit --no-wait
          else
            eas build --platform ios --profile "$profile" --non-interactive --no-wait
          fi

      - name: Reminder
        run: |
          app="${{ github.event_name == 'workflow_dispatch' && inputs.app || 'espresso-escape' }}"
          echo "Build queued on EAS for $app (1.0.6 / ASC 6809059605)."
          echo "Watch: https://expo.dev/accounts/jrod42/projects/$app/builds"
          echo "After auto-submit, open App Store Connect → TestFlight."
