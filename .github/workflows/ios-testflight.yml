name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        type: choice
        options:
          - espresso-escape
          - casa-rustico-go
        default: espresso-escape
      profile:
        description: "EAS profile"
        required: true
        type: choice
        options:
          - production
          - internal
        default: production
      submit:
        description: "Auto-submit to App Store Connect after build"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo auth
        run: eas whoami

      - name: Write App Store Connect API key (optional)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > asc-api-key.p8
            echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"
            echo "ASC API key file written"
          else
            echo "No APPLE_API_KEY_P8 secret — using Expo-stored Apple credentials if configured"
          fi

      - name: Build iOS
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_USE_PRECOMPILED_MODULES: "0"
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --auto-submit --no-wait
          else
            eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
          fi

      - name: Reminder
        run: |
          echo "Build queued on EAS for ${{ inputs.app }}."
          echo "Watch: https://expo.dev/accounts/jrod42/projects/${{ inputs.app }}/builds"
          echo "After auto-submit, open App Store Connect → TestFlight."
